<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title data-i18n="popupTitle">Clockwork Autofill</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="bar">
    <div class="bar-left" id="day-picker">
      <label for="date" data-i18n="labelDay">Day</label>
      <input type="date" id="date" />
      <button id="prev-day" class="ghost icon-only" data-i18n-title="titlePrevDay" title="Previous day"></button>
      <button id="next-day" class="ghost icon-only" data-i18n-title="titleNextDay" title="Next day"></button>
    </div>
    <div class="bar-right">
      <button id="analyze" class="ghost" data-i18n-title="btnRefresh" title="Refresh">Refresh</button>
      <button id="open-options" class="ghost icon-only" data-i18n-title="titleOptions" title="Options"></button>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button id="tab-hours" class="tab" role="tab" aria-selected="true"
            aria-controls="hours-view" data-i18n="tabHours">Hours</button>
    <button id="tab-log" class="tab" role="tab" aria-selected="false"
            aria-controls="log-view" data-i18n="tabLog">Activity</button>
    <button id="tab-tickets" class="tab" role="tab" aria-selected="false"
            aria-controls="tickets-view" data-i18n="tabTickets">Tickets</button>
  </nav>

  <div id="messages"></div>

  <section id="log-view" class="log-view" role="tabpanel" aria-labelledby="tab-log" hidden>
    <div class="log-head">
      <span id="log-count" class="log-count"></span>
      <button id="log-copy" class="ghost" data-i18n="btnCopyLog">Copy for the standup</button>
    </div>
    <ol id="log" class="log"></ol>
    <p id="log-empty" class="empty" data-i18n="logEmpty">Nothing recorded on Jira for this day.</p>
  </section>

  <section id="tickets-view" class="tickets-view" role="tabpanel" aria-labelledby="tab-tickets" hidden>
    <div class="search-row">
      <input type="search" id="tickets-search" class="search"
             data-i18n-placeholder="placeholderSearch"
             placeholder="Search any ticket, yours or not" />
    </div>
    <div class="log-head">
      <span id="tickets-count" class="log-count"></span>
    </div>
    <div id="tickets"></div>
    <p id="tickets-empty" class="empty" data-i18n="ticketsEmpty">No open tickets assigned to you.</p>
  </section>

  <main id="hours-view" role="tabpanel" aria-labelledby="tab-hours">
    <div id="timeline" class="timeline" hidden>
      <div class="scale">
        <div class="ruler"></div>
        <div class="track"></div>
      </div>
    </div>

    <div class="grid-area">
    <div id="legend" class="legend" hidden></div>
    <table id="plan" hidden>
      <thead>
        <tr>
          <th class="col-check">
            <input type="checkbox" id="toggle-all" data-i18n-title="titleToggleAll"
                   title="Select or deselect everything" />
          </th>
          <th class="col-issue" data-i18n="thIssue">Issue</th>
          <th class="col-what" data-i18n="thWhat">What</th>
          <th class="col-hours" data-i18n="thHours">Hours</th>
          <th class="col-time" data-i18n="thTime">Time</th>
          <th class="col-actions"></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <p id="empty" class="empty" data-i18n="emptyAnalysing">Analysing the day…</p>
    <div id="row-tools" class="row-tools" hidden>
      <button id="add-row" class="ghost" data-i18n="btnAddRow">Add a row</button>
      <span class="copy-from">
        <label for="copy-date" data-i18n="labelCopyFrom">Copy from</label>
        <input type="date" id="copy-date" />
        <button id="copy-do" class="ghost" data-i18n="btnCopy">Copy</button>
      </span>
    </div>
    </div>
  </main>

  <footer class="bar">
    <div class="foot-info">
      <div id="total" class="total"></div>
      <div id="site" class="site" data-i18n="siteChecking">Checking the site…</div>
    </div>
    <div class="actions">
      <button id="cancel-send" class="ghost" hidden data-i18n="btnCancel">Cancel</button>
      <button id="submit" class="primary" disabled data-i18n="btnSend">Send worklogs</button>
    </div>
  </footer>

  <datalist id="recent-issues"></datalist>
  <script type="module" src="popup.js"></script>
</body>
</html>
